<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Library</title>
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="icons/book-open-variant.svg" class="icon">
            <p class="project-title">Library</p>
        </div>
        <div class="header-btns">
            <button id="add">Add</button>
            <button id="deleteAll">Delete All</button>
        </div>
        <dialog class="modal">
            <div class="header-modal">
                <button id="close" autofocus>X</button>
            </div>
            <div class="modal-entry">
                <label for="title">Title</label>
                <input type="text" id="title">
            </div>
            <div class="modal-entry">
                <label for="author">Author</label>
                <input type="author" id="author">
            </div>
            <div class="modal-entry">
                <label for="pages">Pages</label>
                <input type="number" id="pages">
            </div>
            <div class="modal-entry">
                <label for="status">Status</label>
                <select name="Status" id="status">
                    <option value="Backlog">Backlog</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Finished">Completed</option>
                </select>
            </div>
            <div class="modal-entry">
                <label for="banner">Banner Color</label>
                <input type="color" id="banner" name="banner" value="#D3D3D3" class="banner-picker"/>
            </div>
            <button id="submit" type="submit">Submit</button>
        </dialog>
    </div>
    <div id="book-container">
    </div>
    <div class="footer">
        <p class="footer-text">Copyright @ Odin Project 2021</p>
    </div>
</body>
</html>
